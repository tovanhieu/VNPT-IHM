<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no" />

  <title>Parameter statistics client-side by distance</title>

  <!-- Load the Chart.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.4.0/Chart.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.5.0/Chart.min.js"></script>
  <link rel="stylesheet" href="https://js.arcgis.com/4.12/esri/themes/light/main.css" />

  <style>
    h1 {
      font-family: Roboto;
      color: #fff;
      margin-top: 50px;
      font-weight: 200;
      text-align: center;
      display: block;
      text-decoration: none;
    }

    .wrapper {
      width: 80%;
      display: block;
      overflow: hidden;
      margin: 0 auto;
      padding: 20px;
      background: #fff;
      border-radius: 4px;
    }

    canvas {
      background: #fff;
      height: 400px;
    }

    html,
    body {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #viewDiv {
      position: absolute;
      left: 0;
      right: 40%;
      top: 0;
      bottom: 0;
      height: 100%;
    }

    #panel {
      position: absolute;
      right: 0;
      height: 100%;
      width: 40%;
      overflow: scroll;
    }

    #num-homicides {
      color: #ed5050;
      font-size: 36pt;
      font-weight: bolder;
      line-height: 0.8;
    }

    #avg-age {
      color: #149dcf;
      font-size: 20pt;
      font-weight: bolder;
    }

    #avg-open-time {
      color: #149dcf;
      font-size: 20pt;
      font-weight: bolder;
    }
  </style>

  <script src="https://js.arcgis.com/4.28/"></script>
 <script>
    require(["esri/config", "esri/Map", "esri/views/MapView", "esri/Graphic", "esri/layers/GraphicsLayer"], function (esriConfig, Map, MapView, Graphic, GraphicsLayer) {
      esriConfig.apiKey = "AAPK99c3b2c0da9b4b99a3272d2c60604effYpA4bmZkOlYzvyMFFPk_2LlwZN36qNTq0VzqecjE4JvlPtEFvA5k3e6-8ia9RmrL";
      const map = new Map({
        basemap: "osm/dark-gray" // basemap styles service

      });
      const view = new MapView({
        map: map,
        center: [107.0842971, 20.9517149], // Longitude, latitude
        zoom: 18, // Zoom level
        container: "viewDiv" // Div element
      });
      const graphicsLayer = new GraphicsLayer();
      map.add(graphicsLayer);
      const point1 = { //Create a point
        type: "point",
        longitude: 107.0847264,
        latitude: 20.9524246
      };
      const simpleMarkerSymbol1 = {
        type: "picture-marker",
        url: "img/hdd.PNG",
        color: [226, 119, 40],  // Orange
        outline: {
          color: [255, 255, 255], // White
          width: 1
        }
      };
      const pointGraphic1 = new Graphic({
        geometry: point1,
        symbol: simpleMarkerSymbol1
      });
      const point2 = { //Create a point
        type: "point",
        longitude: 107.084837,
        latitude: 20.9524361
      };
      const point3 = { //Create a point
        type: "point",
        longitude: 107.0846216,
        latitude: 20.9525247
      };
      const point4 = { //Create a point
        type: "point",
        longitude: 107.0845264,
        latitude: 20.9524146
      };
      const simpleMarkerSymbol2 = {
        type: "picture-marker",
        url: "img/rss.PNG",
        color: [226, 119, 40],  // Orange
        outline: {
          color: [255, 255, 255], // White
          width: 1
        }
      };
      const simpleMarkerSymbol3 = {
        type: "picture-marker",
        url: "img/de_rss.PNG",
        color: [226, 119, 40],  // Orange
        outline: {
          color: [255, 255, 255], // White
          width: 1
        }
      };
      const simpleMarkerSymbol4 = {
        type: "picture-marker",
        url: "img/de_hdd.PNG",
        color: [226, 119, 40],  // Orange
        outline: {
          color: [255, 255, 255], // White
          width: 1
        }
      };
      const pointGraphic2 = new Graphic({
        geometry: point2,
        symbol: simpleMarkerSymbol2
      });
      const pointGraphic3 = new Graphic({
        geometry: point3,
        symbol: simpleMarkerSymbol3
      });
      const pointGraphic4 = new Graphic({
        geometry: point4,
        symbol: simpleMarkerSymbol4
      });
      graphicsLayer.add(pointGraphic1);
      graphicsLayer.add(pointGraphic2);
      graphicsLayer.add(pointGraphic3);
      graphicsLayer.add(pointGraphic4);
    });
    
  </script>
</head>

<body>
  <div id="viewDiv"></div>
  <div id="panel">
    <div style="padding: 15px;">

      <canvas id="env-chart" height="170" width="550"></canvas>
      <canvas id="Node-status-chart" height="150" width="500"></canvas>
      <canvas id="line-chart" width="250" height="150"></canvas>
      <script>
        const yearCanvas = document.getElementById("env-chart");
        yearChart = new Chart(yearCanvas.getContext("2d"), {
          type: "line",
          data: {
            labels: [
              "08:00 AM",
              "08:01 AM",
              "08:02 AM",
              "08:03 AM",
              "08:04 AM",
              "08:05 AM",
              "08:06 AM",
              "08:07 AM",
              "08:08 AM",
              "08:09 AM"
            ],
            datasets: [
              {
                label: "Nhiệt độ",
                backgroundColor: "#149dcf",
                stack: "Stack 0",
                data: [27, 27.8, 27.6, 28, 29, 28.3, 26.7, 26.9, 29, 28]
              },
              {
                label: "Độ ẩm",
                backgroundColor: "#ed5050",
                stack: "Stack 0",
                data: [80, 80.12, 80.45, 86.5, 87, 88, 89.9, 88.76, 87.87, 88]
              },
              {
                label: "Chất lượng không khí",
                backgroundColor: "#ed9213",
                stack: "Stack 0",
                data: [98.3, 97.155, 97, 97.77, 98.14, 95.21, 98.887, 98.76, 97.87, 99.478]
              }
            ]
          },
          options: {
            responsive: false,
            legend: {
              position: "top"
            },
            title: {
              display: true,
              text: "Thông số môi trường"
            },
            scales: {
              xAxes: [
                {
                  stacked: true
                }
              ],
              yAxes: [
                {
                  stacked: true,
                  ticks: {
                    beginAtZero: true
                  }
                }
              ]
            }
          }
        });
      </script>
      <script>
        const ageCanvas = document.getElementById("Node-status-chart");
        ageChart = new Chart(ageCanvas.getContext("2d"), {
          type: "horizontalBar",
          data: {
            labels: ["Node_01", "Node_02", "Node_03", "Node_04"],
            datasets: [
              {
                label: "Năng lượng tiêu thụ (%)",
                backgroundColor: "#149dcf",
                stack: "Stack 0",
                data: [30, 45, 76, 97]
              },
              {
                label: "Công suất tiêu thụ (mW)",
                backgroundColor: "#ed5050",
                stack: "Stack 0",
                data: [1.32, 2.32, 2.7, 5.32]
              }
            ]
          },
          options: {
            responsive: false,
            legend: {
              position: "top"
            },
            title: {
              display: true,
              text: "Quản lí thiết bị"
            },
            scales: {
              xAxes: [
                {
                  stacked: true,
                  ticks: {
                    beginAtZero: true
                  }
                }
              ],
              yAxes: [
                {
                  stacked: true
                }
              ]
            }
          }
        });
      </script>
      <script>
        new Chart(document.getElementById("line-chart"), {
          type: 'line',
          data: {
            labels: [12, 12.32, 12.43, 13.23, 13.48, 14.02, 14.45, 15.07, 15.38, 16],
            datasets: [{
              data: [86, 114, 106, 106, 107, 111, 133, 221, 350, 250],
              label: "Băng thông (Mbps)",
              borderColor: "#3e95cd",
              fill: false
            }, {
              data: [282, 350, 411, 345, 335, 409, 247, 202, 400, 320],
              label: "Download (Mbps)",
              borderColor: "#8e5ea2",
              fill: false
            }, {
              data: [168, 170, 178, 190, 203, 276, 408, 490, 275, 334],
              label: "Upload (Mbps)",
              borderColor: "#3cba9f",
              fill: false
            }
            ]
          },
          options: {
            title: {
              display: true,
              text: 'Lưu lượng mạng hạ tầng IT'
            }
          }
        });
      </script>
    </div>
  </div>
</body>

</html>
